<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eff1f5">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>InkDOS Breeze</title><link rel="stylesheet" href="shell/shell.css">
<script src="shell/apps.js" defer></script><script src="shell/shell.js" defer></script></head>
<body><main class="desktop" id="desktop">
<header class="top-panel"><button class="brand" id="startButton" type="button" aria-expanded="false" aria-controls="launcher"><span class="brand-mark" aria-hidden="true">◈</span><span>InkDOS</span></button><div class="panel-center" id="activeTitle">Desktop</div><div class="panel-right"><span class="session-label">Breeze preview</span><span class="panel-dot" aria-hidden="true"></span></div></header>
<section class="desktop-workspace" id="workspace" aria-label="Desktop workspace"><div class="welcome" id="welcome"><div class="welcome-mark" aria-hidden="true">◈</div><p class="eyebrow">INKDOS BREEZE</p><h1>Your workspace.<br>One calm place.</h1><p class="welcome-copy">Open your everyday tools in windows. Your existing apps keep their own interfaces and features.</p><button class="primary-action" id="welcomeOpen" type="button">Explore applications <span aria-hidden="true">→</span></button></div><div class="window-layer" id="windowLayer"></div></section>
<footer class="dock" aria-label="Taskbar"><div class="dock-apps" id="dockApps"></div><div class="dock-status"><span class="status-indicator"></span><span>InkDOS Breeze</span></div></footer>
<section class="launcher" id="launcher" aria-label="Application launcher" hidden><div class="launcher-heading"><div><p class="eyebrow">APPLICATIONS</p><h2>What would you like to do?</h2></div><button class="icon-button" id="closeLauncher" type="button" aria-label="Close launcher">×</button></div><label class="search-box"><span aria-hidden="true">⌕</span><input id="appSearch" type="search" placeholder="Search applications" autocomplete="off"></label><nav class="categories" id="categories" aria-label="Application categories"><button class="category active" type="button" data-category="All">All</button><button class="category" type="button" data-category="Productivity">Productivity</button><button class="category" type="button" data-category="Media">Media</button><button class="category" type="button" data-category="Utilities">Utilities</button></nav><div class="app-grid" id="appGrid"></div><p class="launcher-footnote">Applications open here without replacing their original app interface.</p></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div></main></body></html>
