# Common Windows programs (compat/apps.json) on the engine: each one downloaded from its
# official site and run in its own job, then one table, compat/apps-results.md.
# Runs after every engine build, every Monday, or by hand (one program with "only").
name: compat-apps
on:
  workflow_run:
    workflows: [engine]
    types: [completed]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "one program (name in compat/apps.json); empty = all"
        required: false
permissions:
  contents: write
concurrency:
  group: compat-apps
  cancel-in-progress: true
jobs:
  list:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.l.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          python3 -c "import json,os; n=[a['name'] for a in json.load(open('compat/apps.json'))]; o=os.environ.get('ONLY'); print('names=' + json.dumps([o] if o else n))" >> "$GITHUB_OUTPUT"
        env:
          ONLY: ${{ github.event.inputs.only }}
  run:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.list.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run
        run: REQUEST=compat/apps.json ONLY=${{ matrix.name }} python3 tests/apps/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "app-${{ matrix.name }}", path: tests/apps/out }
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: "app-*", path: out }
      - name: Table
        run: |
          python3 tools/apps-report.py out "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add compat/apps-results.md
          git diff --cached --quiet && exit 0
          git commit -m "Common programs: results"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
