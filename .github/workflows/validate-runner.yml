name: validate-runner

on:
  pull_request:
    paths:
      - "tests/apps/run.py"
      - "compat/apps.json"
      - ".github/workflows/validate-runner.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile tests/apps/run.py
      - name: Validate compatibility manifest
        run: python -m json.tool compat/apps.json > /dev/null
