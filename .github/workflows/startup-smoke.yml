name: startup-smoke

on:
  pull_request:
    paths:
      - "src/engine/**"
      - "tests/startup/**"
      - ".github/workflows/startup-smoke.yml"

permissions:
  contents: read

jobs:
  startup-info:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build InkSoC engine
        run: |
          cd src/engine
          cargo build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/inksoc.wasm ../../inksoc.wasm
      - name: Host unit tests (MMU, address spaces, startup strings)
        run: |
          cd src/engine
          cargo test --release --lib _tests
      - name: Compile startup probes
        run: |
          x86_64-w64-mingw32-gcc -O2 -Wall -o tests/startup/startup-info.exe tests/startup/startup-info.c
          x86_64-w64-mingw32-gcc -O2 -Wall -DSTARTUP_FIXTURE -o tests/startup/fixture-build.exe tests/startup/startup-info.c
          x86_64-w64-mingw32-gcc -O2 -Wall -DPROBE_A -DCASE_WINDOW_END -o tests/startup/startup-info-badptr-a-window-end.exe tests/startup/startup-info-badptr.c
          x86_64-w64-mingw32-gcc -O2 -Wall -DPROBE_A -DCASE_OUTSIDE -o tests/startup/startup-info-badptr-a-outside.exe tests/startup/startup-info-badptr.c
          x86_64-w64-mingw32-gcc -O2 -Wall -DPROBE_W -DCASE_WINDOW_END -o tests/startup/startup-info-badptr-w-window-end.exe tests/startup/startup-info-badptr.c
          x86_64-w64-mingw32-gcc -O2 -Wall -DPROBE_W -DCASE_OUTSIDE -o tests/startup/startup-info-badptr-w-outside.exe tests/startup/startup-info-badptr.c
          x86_64-w64-mingw32-gcc -O2 -Wall -o tests/startup/virtualalloc-api.exe tests/startup/virtualalloc-api.c
          x86_64-w64-mingw32-gcc -O2 -Wall -o tests/startup/gdi-api.exe tests/startup/gdi-api.c -lgdi32
          x86_64-w64-mingw32-gcc -O2 -Wall -o tests/startup/ntalloc-api.exe tests/startup/ntalloc-api.c
      - name: Run startup probes in InkSoC
        env:
          LIMIT: "90"
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys
          # The fixture needs its non-ASCII file name, which the engine gives it (winefb.rs).
          fixture = os.path.abspath("tests/startup/startup-info-fixtúre.exe")
          shutil.copy("tests/startup/fixture-build.exe", fixture)
          with open("bin/wine/list.json", encoding="utf-8") as f:
              support = [os.path.abspath(os.path.join("bin/wine", name)) for name in json.load(f)]

          def run(exe_path, exe_name):
              payload = json.dumps({"files": [exe_path] + support, "exe": exe_name, "args": ""})
              result = subprocess.run(["node", "compat/run.mjs", "--one", payload],
                                      text=True, capture_output=True, timeout=120)
              print(result.stdout)
              if result.stderr:
                  print(result.stderr, file=sys.stderr)
              try:
                  return json.loads(result.stdout.strip().splitlines()[-1])
              except Exception as exc:
                  raise SystemExit(f"Could not parse InkSoC result for {exe_name}: {exc}")

          # 1. ordinary program: zeros, ASCII title
          report = run(os.path.abspath("tests/startup/startup-info.exe"), "startup-info.exe")
          if report.get("status") != "exit" or report.get("exitCode") != 0:
              raise SystemExit(f"Startup probe failed: {report}")
          if "INKSOC_STARTUP_INFO_OK" not in report.get("out", ""):
              raise SystemExit(f"Startup probe marker missing: {report}")

          # 2. fixture: distinct STARTUPINFO values, non-ASCII title
          report = run(fixture, "startup-info-fixtúre.exe")
          if report.get("status") != "exit" or report.get("exitCode") != 0:
              raise SystemExit(f"Fixture probe failed: {report}")
          if "INKSOC_STARTUP_INFO_OK" not in report.get("out", ""):
              raise SystemExit(f"Fixture probe marker missing: {report}")

          # 3. invalid destinations: the call must raise an access violation.
          # Anything else (normal return, timeout, other crash, unclassified
          # error) fails the job.
          def classify(report):
              if "BADPTR_RETURNED" in report.get("out", ""):
                  return "RETURNED"
              if report.get("status") == "exit":
                  return "EXITED"
              if str(report.get("error", "")).startswith("access violation"):
                  return "ACCESS_VIOLATION"
              if report.get("status") == "timeout":
                  return "TIMEOUT"
              return "UNCLASSIFIED"

          for api in ("a", "w"):
              for case in ("window-end", "outside"):
                  name = f"startup-info-badptr-{api}-{case}.exe"
                  report = run(os.path.abspath("tests/startup/" + name), name)
                  verdict = classify(report)
                  print(f"bad pointer {api.upper()} {case}: {verdict}")
                  if verdict != "ACCESS_VIOLATION":
                      raise SystemExit(f"Bad pointer probe {name} not an access violation ({verdict}): {report}")

          # 4. VirtualAlloc / VirtualFree through the API: commits inside, past and
          # outside a reservation, repeated commits and decommits, release.
          report = run(os.path.abspath("tests/startup/virtualalloc-api.exe"), "virtualalloc-api.exe")
          if report.get("status") != "exit" or report.get("exitCode") != 0:
              raise SystemExit(f"VirtualAlloc probe failed: {report}")
          if "VIRTUALALLOC_API_OK" not in report.get("out", ""):
              raise SystemExit(f"VirtualAlloc probe marker missing: {report}")
          print("VirtualAlloc API probe: OK")

          # 5. GDI handle table, attribute blocks and a child process (the child is this program)
          report = run(os.path.abspath("tests/startup/gdi-api.exe"), "gdi-api.exe")
          if report.get("status") != "exit" or report.get("exitCode") != 0:
              raise SystemExit(f"GDI probe failed: {report}")
          if "GDI_API_OK" not in report.get("out", ""):
              raise SystemExit(f"GDI probe marker missing: {report}")
          print("GDI API probe: OK")

          # 6. NtAllocateVirtualMemory / NtFreeVirtualMemory through ntdll
          report = run(os.path.abspath("tests/startup/ntalloc-api.exe"), "ntalloc-api.exe")
          if report.get("status") != "exit" or report.get("exitCode") != 0:
              raise SystemExit(f"NT allocation probe failed: {report}")
          if "NTALLOC_API_OK" not in report.get("out", ""):
              raise SystemExit(f"NT allocation probe marker missing: {report}")
          print("NT allocation probe: OK")
          PY
