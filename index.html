<!doctype html>
<html lang="en">
<head><script src="/assets/endereco.js?v=2"></script><script src="/assets/inkos-bridge.js?v=2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/assets/icones-inkdos/wine.svg?v=3">
<title>InkSoC</title>
<!-- The InkSoC engine page: no desktop of its own. InkOS opens it in a window
     (the InkOS window is the program's window); engine.js says what it runs. -->
<style>
  :root{--accent:#7c3aed}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#0c0c0c;color:#c0c0c0;font:14px -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
  #screen{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#0c0c0c}
  #screen.gui{background:#000}
  #screen canvas{position:absolute;left:0;top:0;image-rendering:auto}
  html[data-smooth="0"] #screen canvas{image-rendering:pixelated}
  #con{position:fixed;inset:0;z-index:5;overflow:auto;display:flex;flex-direction:column;background:#0c0c0c}
  #con[hidden],#con [hidden]{display:none}
  #con pre{margin:0;padding:8px 10px 2px;white-space:pre-wrap;word-break:break-all;font:13px/1.25 Consolas,Menlo,ui-monospace,monospace;color:#c0c0c0;user-select:text;-webkit-user-select:text}
  #con pre a{color:#c4b5fd}
  #con .ok{color:#4ade80}#con .bad{color:#f87171}
  .cline{border:0;background:#0c0c0c;color:#c0c0c0;font:13px/1.25 Consolas,Menlo,ui-monospace,monospace;padding:2px 10px 10px;outline:none;caret-color:#c0c0c0;width:100%}
  #con .progs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 10px 10px;font:13px system-ui;color:#aaa}
  #con .progs button{font:13px system-ui;border:0;border-radius:7px;padding:6px 12px;background:var(--accent);color:#fff;cursor:pointer}
  #note{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:20;max-width:calc(100% - 20px);background:rgba(28,28,30,.92);color:#eee;border-radius:9px;padding:6px 12px;font:13px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #note[hidden]{display:none}
  #padbtn{position:fixed;right:8px;top:8px;z-index:16;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:rgba(20,20,24,.45);color:#fff;font:18px system-ui;cursor:pointer}
  #padbtn[hidden]{display:none}
  #pad{position:fixed;left:0;right:0;bottom:8px;height:0;z-index:15;pointer-events:none}
  #pad[hidden]{display:none}
  #pad .gp{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border:1.5px solid rgba(255,255,255,.45);background:rgba(20,20,24,.32);color:#fff;font:600 18px -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
  #pad .gp.down{background:rgba(124,58,237,.55)}
  #pad .btn,#pad .stick{border-radius:50%}
  #pad .trig,#pad .small{border-radius:10px;font-size:13px}
  #pad .small{font-size:12px;font-weight:500}
  #pad .stick i{width:46%;height:46%;border-radius:50%;background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.6)}
  #pad .dpad{border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  #pad .dpad svg{width:100%;height:100%}
  #pad .dpad path{fill:rgba(20,20,24,.32);stroke:rgba(255,255,255,.45);stroke-width:1.5}
  #pad .dpad path.ar{fill:rgba(255,255,255,.75);stroke:none}
  #pad .dpad:not([data-dir=""])[data-dir] path:first-child{fill:rgba(124,58,237,.45)}
  #pad.editing .gp{outline:1px dashed rgba(255,255,255,.7)}
  #pad .gp.picked{outline:2px solid #facc15}
  #pad .gpbar{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;pointer-events:auto;display:flex;gap:6px;align-items:center;background:rgba(20,20,24,.5);border-radius:10px;padding:4px 6px;color:#fff;font:12px system-ui}
  #pad .gpbar button{font:12px system-ui;border:0;border-radius:7px;padding:4px 10px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer}
  #pad .gpbar input{width:90px}
  .sym{display:inline-block;width:16px;height:16px;flex:none;background:currentColor;-webkit-mask:var(--s) center/contain no-repeat;mask:var(--s) center/contain no-repeat;vertical-align:-3px}
</style>
</head>
<body>
<div id="screen"></div>
<div id="con"></div>
<div id="note" hidden></div>
<button id="padbtn" type="button" title="On-screen controls" aria-label="On-screen controls" hidden>&#x1F3AE;</button>
<div id="pad" hidden></div>
<script src="prefs.js?v=4"></script>
<script src="engine.js?v=28"></script>
<script src="pad.js?v=3"></script>
</body>
</html>
